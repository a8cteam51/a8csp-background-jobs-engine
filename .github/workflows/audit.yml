name: Audit

on:
  pull_request:
  push:
    branches: [trunk]
  schedule:
    # Weekly Monday 07:00 UTC -- catches newly disclosed advisories between dependency bumps.
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply-chain audit
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-supply-chain-audit.yml@trunk
    with:
      npm-audit-flags: '--audit-level=high --omit=dev'
