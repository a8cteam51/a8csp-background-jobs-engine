name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build the release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Tagging before composer changelog:write leaves the materialized release version out of sync.
      - name: Verify release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag_version=${TAG#v}
          plugin_version=$(grep -m 1 '^[[:space:]]*\*[[:space:]]*Version:' a8csp-background-tasks-engine.php | sed -E 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/' || true)
          package_version=$(jq -r .version package.json)
          changelog_version=$(grep -m 1 '^## ' CHANGELOG.md | sed -E 's/^## \[?([^] ]+)\]? - .*/\1/' || true)

          if [ -z "$plugin_version" ] || [ -z "$package_version" ] || [ -z "$changelog_version" ] || [ "$tag_version" != "$plugin_version" ] || [ "$tag_version" != "$package_version" ] || [ "$tag_version" != "$changelog_version" ]; then
            echo "::error::release versions disagree: tag=$tag_version plugin=${plugin_version:-missing} package=${package_version:-missing} changelog=${changelog_version:-missing}" >&2
            exit 1
          fi
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2, wp-cli
      - name: Validate changelog
        run: |
          composer install --no-interaction
          composer changelog:validate
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction
      # Regenerating the committed POT prevents source changes from shipping stale strings.
      - name: Generate translation template
        run: |
          wp package install wp-cli/i18n-command:2.7.0
          wp i18n make-pot ./ --slug=a8csp-background-tasks-engine
          test -f languages/a8csp-background-tasks-engine.pot
      - name: Install dist-archive command
        run: wp package install wp-cli/dist-archive-command:3.2.2
      - name: Create plugin archive
        run: wp dist-archive . "./${GITHUB_REPOSITORY##*/}.zip" --plugin-dirname="${GITHUB_REPOSITORY##*/}"
      - name: Upload the archive for the smoke and publish jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zip
          path: ./*.zip
          retention-days: 1

  smoke:
    name: Smoke test the artifact
    needs: build
    permissions:
      actions: read
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-release-smoke.yml@trunk
    with:
      zip-artifact: release-zip
      plugin-slug: ${{ github.event.repository.name }}
      # The artifact smokes without Action Scheduler on purpose: the engine activates and
      # registers its CLI surface in the documented WP-Cron-only degraded posture.
      extra-smoke-commands: '["help background-tasks"]'

  publish:
    name: Publish the release
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download the smoke-tested archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hyphenated SemVer tags must stay off the stable updater's latest-release endpoint.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" ./*.zip --generate-notes --prerelease --latest=false
          else
            gh release create "$GITHUB_REF_NAME" ./*.zip --generate-notes
          fi
