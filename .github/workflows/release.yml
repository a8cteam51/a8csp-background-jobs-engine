name: Release

on:
  push:
    tags: ['v*']
  # Exercises the release path without publishing, which is the only way to test it before a tag exists.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub release'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    name: Release
    permissions:
      actions: read
      contents: write
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-release.yml@trunk
    with:
      plugin-slug: a8csp-background-jobs-engine
      # Matches the plugin header's Requires PHP; below it WordPress refuses to activate the artifact.
      php-version: '8.5'
      # The artifact smokes without Action Scheduler on purpose: the engine activates and
      # registers its CLI surface in the documented WP-Cron-only degraded posture.
      extra-smoke-commands: '["help a8csp-bgje"]'
      publish: ${{ github.event_name == 'push' || inputs.publish }}
