name: CodeQL

on:
  pull_request:
  push:
    branches: [trunk]
  schedule:
    # Weekly Monday 08:00 UTC -- catches newly published CodeQL query findings between workflow changes.
    - cron: '0 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      actions: read
      # CodeQL's SARIF upload in the called workflow needs this -- a reusable
      # workflow can never escalate beyond what this job grants.
      security-events: write
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-codeql.yml@trunk
