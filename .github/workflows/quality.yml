name: Quality

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-php-lint.yml@trunk
    with:
      scripts: '["lint:php:phpcs", "lint:php:phpcs:tests", "lint:php:phpstan"]'

  php-syntax:
    name: PHP Syntax
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-php-syntax-check.yml@trunk
    with:
      php-versions: '["8.5", "8.6"]'

  bootstrap-syntax:
    name: Bootstrap syntax (PHP ${{ matrix.php }})
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      # Only the entry file and functions-bootstrap.php must parse below the plugin's PHP
      # floor; functions.php, uninstall.php, and index.php load after the requirements gate
      # and are excluded. Discover the entry by its WordPress "Plugin Name:" header because its
      # filename is repository-specific. functions-bootstrap.php shares the below-floor constraint
      # but lacks the plugin header, so lint it explicitly to keep it inside this matrix.
      - name: Check the below-floor files for syntax errors
        run: |
          set -euo pipefail

          mapfile -t entry_files < <(grep -l 'Plugin Name:' "$GITHUB_WORKSPACE"/*.php || true)
          entry_count=${#entry_files[@]}
          if [ "$entry_count" -ne 1 ]; then
            echo "::error::expected exactly one root *.php file with a 'Plugin Name:' header, found $entry_count" >&2
            exit 1
          fi
          php -l "${entry_files[0]}"
          php -l "$GITHUB_WORKSPACE/functions-bootstrap.php"

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer validate --strict --no-interaction
      - run: composer changelog:validate
