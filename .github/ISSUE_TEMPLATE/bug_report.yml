name: Bug report
description: Create a bug report to help us improve.
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Activate the plugin alongside Action Scheduler.
        2. Register a recurring job from a client plugin.
        3. ...

        Attach any media by drag and dropping or selecting upload.

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
      placeholder: |
        e.g. The job runs on its schedule and shows up in wp background-jobs runs list.

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      placeholder: |
        e.g. The run never starts and the schedules table shows a growing misfire count.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The versions the bug occurred on, plus anything unusual about the setup (multisite, other plugins involved).
      placeholder: |
        - WordPress version:
        - PHP version:
        - Action Scheduler version:
        - Plugin version:
        - Multisite: yes/no
    validations:
      required: true
